name: APK derle
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dosyalari hazirla
        run: if [ -f github-yukle.zip ]; then unzip -o github-yukle.zip; fi; bash kur.sh
      - name: Gradle indir
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME
      - name: APK derle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          set -o pipefail
          $HOME/gradle-8.11.1/bin/gradle --no-daemon assembleDebug 2>&1 | tee build.log || { m=$(grep -E "error:|What went wrong|Could not|e: " -A4 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error::$m"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: PortalOsmanli-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Indirme linkine koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PortalOsmanli.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk PortalOsmanli.apk --title "Portal Osmanli APK" --notes "Son derleme"
